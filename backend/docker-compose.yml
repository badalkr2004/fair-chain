version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    environment:
      - DATABASE_URL=postgresql://fairchain:fairchain@postgres:5432/fairchain?schema=public
      - PORT=8080
      - NODE_ENV=development
      - JWT_SECRET=changeme-in-production
      - JWT_EXPIRES_IN=24h
      - JWT_REFRESH_EXPIRES_IN=7d
      - CORS_ORIGIN=*
      - RUN_MIGRATIONS=true
      - SEED_DATABASE=true
      - NODE_OPTIONS=--max-old-space-size=2048
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      # Don't mount node_modules
      - /app/node_modules
    networks:
      - fairchain-network

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=fairchain
      - POSTGRES_PASSWORD=fairchain
      - POSTGRES_DB=fairchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fairchain" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fairchain-network

volumes:
  postgres_data:


networks:
  fairchain-network:
    driver: bridge
