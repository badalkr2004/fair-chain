services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://fairchain:fairchain@postgres:5432/fairchain?schema=public
      - PORT=8080
      - NODE_ENV=development
      - CORS_ORIGIN=*
      - NODE_OPTIONS=--max-old-space-size=2048
    restart: unless-stopped
    volumes:
      - ./src:/app/src
      - ./prisma:/app/prisma
      # Don't mount node_modules
      - /app/node_modules
    networks:
      - fairchain-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=fairchain
      - POSTGRES_PASSWORD=fairchain
      - POSTGRES_DB=fairchain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U fairchain" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - fairchain-network

volumes:
  postgres_data:

networks:
  fairchain-network:
    driver: bridge
